seed: 42
paths:
  data_dir: data
  models_dir: models
  reports_dir: reports
  train_csv: data/train.csv
  test_csv: data/test.csv
  date_map_csv: data/date_map.csv
  raw_dir: data/raw/hull
  panel_path: data/lake/panel_live.parquet
  predictions_path: data/lake/predictions.parquet
  state_path: data/lake/ingest_state.json
  log_path: data/lake/ingest_log.jsonl
  health_path: data/lake/health.json
data_source:
