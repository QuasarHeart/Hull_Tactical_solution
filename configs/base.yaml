  max_lookback_days: 5
  require_competition_alignment: true
wandb:
  enabled: true
  project: hull_tactical
  entity: null
  mode: null          # null -> online; "offline" / "disabled" also accepted
  base_url: https://api.forge.coreweave.com
  tags: []
  log_artifacts: true
