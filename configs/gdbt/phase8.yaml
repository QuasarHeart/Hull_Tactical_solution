_base_: phase6.yaml
run_name: gdbt_phase8_feature_rankic
phase8:
  # Optional explicit OOF path. If null, the script auto-discovers the newest
  # models/*_gdbt_notebook_cv_offline_*/oof_predictions.csv. --oof overrides both.
  oof_path: null
  test_years: [2015, 2017, 2019, 2021, 2023, 2025]
  train_window: 800
  gap: 1
  rolling_windows: [60, 120]
  regime_window: 20
  n_regimes: 3
  regime_quantiles: [0.33, 0.67]
  high_corr_threshold: 0.90
  fdr_alpha: 0.05
  bootstrap_reps: 2000
  bootstrap_block: 20
  min_regime_obs: 20
  min_fold_obs: 30
  seed: 42
